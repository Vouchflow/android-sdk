name: Android SDK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Run tests & lint
        run: ./gradlew :sdk:test :sdk:lint --stacktrace

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "system-images;android-33;default;x86_64" \
            "emulator" \
            "platform-tools" >/dev/null

      # Two-pass test run against the same emulator session:
      #
      # Pass 1 — no auth (before PIN is set):
      #   noAuth_verifyThrowsError runs; verify() must throw EnrollmentFailed or
      #   BiometricUnavailable on a device with no credential configured.
      #   ConfigureInfallibilityTest also runs here — issue #1 regression coverage;
      #   configure()/storage infallibility needs no device credential.
      #
      # Pass 2 — device credential (after PIN "1234" is set):
      #   EnrollmentIntegrationTest and passcodeEnrolled_enrollAndVerifySucceeds run.
      #   biometricEnrolled skips (no fingerprint); noAuth skips (PIN now active).
      #   Biometric coverage is handled by the separate integration-test-biometric job.
      - name: Run instrumented integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          avd-name: integration_avd
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            ./gradlew :sdk:connectedAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=dev.vouchflow.sdk.integration.PasskeyTypeIntegrationTest#noAuth_verifyThrowsError,dev.vouchflow.sdk.integration.ConfigureInfallibilityTest" --stacktrace
            adb shell locksettings set-pin 1234
            ./gradlew :sdk:connectedAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=dev.vouchflow.sdk.integration.EnrollmentIntegrationTest,dev.vouchflow.sdk.integration.PasskeyTypeIntegrationTest" --stacktrace

  integration-test-biometric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # google_apis image has the full Settings app — required because the
          # fingerprint enrollment wizard intent (FINGERPRINT_ENROLL_INTRODUCTION)
          # is not registered on the bare default image.
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "system-images;android-33;google_apis;x86_64" \
            "emulator" \
            "platform-tools" >/dev/null

      - name: Create AVD with fingerprint sensor
        run: |
          # avdmanager silently fails on this runner; create all AVD files manually.
          # The emulator searches: $ANDROID_AVD_HOME, $ANDROID_SDK_HOME/avd, $HOME/.android/avd
          # The emulator-runner (reactivecircus) always writes config patches to $HOME/.android/avd,
          # so we keep the AVD data there and mirror the descriptor to ANDROID_AVD_HOME if needed.
          AVD_BASE="$HOME/.android/avd"
          mkdir -p "$AVD_BASE/biometric_avd.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/biometric_avd.avd\npath.rel=avd/biometric_avd.avd\ntarget=android-33\n' \
            "$AVD_BASE" > "$AVD_BASE/biometric_avd.ini"
          printf '%s\n' \
            "AvdId=biometric_avd" \
            "PlayStore.enabled=false" \
            "abi.type=x86_64" \
            "avd.ini.displayname=biometric_avd" \
            "avd.ini.encoding=UTF-8" \
            "disk.dataPartition.size=800M" \
            "hw.cpu.arch=x86_64" \
            "hw.fingerprint=yes" \
            "hw.gpu.enabled=yes" \
            "hw.gpu.mode=auto" \
            "hw.ramSize=2048" \
            "image.sysdir.1=system-images/android-33/google_apis/x86_64/" \
            "runtime.network.latency=none" \
            "runtime.network.speed=full" \
            "tag.display=Google APIs" \
            "tag.id=google_apis" \
            "vm.heapSize=256" \
            > "$AVD_BASE/biometric_avd.avd/config.ini"
          # If ANDROID_AVD_HOME is set and differs, mirror the descriptor there
          if [ -n "${ANDROID_AVD_HOME:-}" ] && [ "$ANDROID_AVD_HOME" != "$AVD_BASE" ]; then
            mkdir -p "$ANDROID_AVD_HOME"
            cp "$AVD_BASE/biometric_avd.ini" "$ANDROID_AVD_HOME/biometric_avd.ini"
          fi

      # Fingerprint enrollment and biometric integration test.
      #
      # Enrollment flow (automated via keyevent + adb emu finger touch):
      #   1. Set PIN 1234 (required before fingerprint enrollment on Android).
      #   2. Open the fingerprint enrollment wizard via direct activity launch.
      #   3. Tab to the first button (Get started / Start) and press Enter.
      #   4. Type PIN on the confirmation screen and press Enter.
      #   5. Send 10 finger touch events (6 are required; 10 for margin).
      #   6. Dismiss the completion screen with Enter.
      #
      # Test execution:
      #   A background watcher sends adb emu finger touch 1 every second so any
      #   BiometricPrompt that appears during the test is accepted automatically.
      #   BiometricSimulator.isBiometricStrongAvailable() gates the test; if enrollment
      #   failed for any reason the test skips rather than failing.
      #
      # The emulator-runner action runs each line of `script:` via its own
      # `sh -c`, so shell variables and multi-line blocks don't carry across
      # lines. We dodge that by writing the whole sequence to a file in the
      # previous step and having the action just execute the file.
      - name: Stage biometric test script
        run: |
          mkdir -p /tmp/biometric_screens
          cat > /tmp/biometric_test.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          shot() { adb shell screencap -p "/sdcard/$1.png" 2>/dev/null && adb pull "/sdcard/$1.png" "/tmp/biometric_screens/$1.png" 2>/dev/null || echo "shot $1 failed (continuing)"; }
          dump() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml "/tmp/biometric_screens/$1.xml" 2>/dev/null || echo "dump $1 failed (continuing)"; }
          # Tap a button by visible text. Looks up bounds in the current UI
          # hierarchy; centres the tap. Returns 1 if not found.
          tap_text() {
            local target="$1"
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || return 1
            adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1 || return 1
            python3 - "$target" <<'PY'
          import re, sys, subprocess
          target = sys.argv[1].lower().strip()
          xml = open('/tmp/ui.xml').read()
          # Match exact text (case-insensitive) on a clickable element. Substring
          # matches were tapping things like "Learn more" links instead of the
          # MORE button. Prefer clickable=true elements, fall back to any.
          node_re = re.compile(r'<node[^>]*?>')
          best = None
          for m in node_re.finditer(xml):
              node = m.group(0)
              tm = re.search(r'text="([^"]*)"', node)
              if not tm:
                  continue
              text = tm.group(1).strip().lower()
              if text != target:
                  continue
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if not bm:
                  continue
              x1, y1, x2, y2 = map(int, bm.groups())
              clickable = 'clickable="true"' in node
              if clickable:
                  best = (text, x1, y1, x2, y2, "clickable")
                  break
              if best is None:
                  best = (text, x1, y1, x2, y2, "non-clickable")
          if best is None:
              # Fall back to content-desc exact match.
              for m in node_re.finditer(xml):
                  node = m.group(0)
                  cm = re.search(r'content-desc="([^"]*)"', node)
                  if not cm or cm.group(1).strip().lower() != target:
                      continue
                  bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
                  if not bm:
                      continue
                  x1, y1, x2, y2 = map(int, bm.groups())
                  best = (target, x1, y1, x2, y2, "desc")
                  break
          if best is None:
              sys.exit(1)
          text, x1, y1, x2, y2, kind = best
          cx, cy = (x1+x2)//2, (y1+y2)//2
          print(f"tap [{kind}] '{text}' at {cx},{cy}", file=sys.stderr)
          subprocess.run(["adb", "shell", "input", "tap", str(cx), str(cy)], check=True)
          PY
          }
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell locksettings set-pin 1234
          sleep 2
          adb shell input keyevent 82
          sleep 1
          adb shell am start -n com.android.settings/com.android.settings.biometrics.fingerprint.FingerprintEnrollIntroduction
          sleep 4
          # Step 1: PIN re-entry. Launching the enroll intent prompts for the
          # device PIN before the Pixel Imprint UI appears.
          shot 01_pin_prompt && dump 01_pin_prompt
          adb shell input text 1234
          sleep 0.5
          adb shell input keyevent 66
          sleep 4
          shot 02_after_pin && dump 02_after_pin
          # Step 2: walk through the Pixel Imprint onboarding ("MORE", then
          # "I agree" / "Get started") until we land on an enrollment screen.
          for i in 1 2 3 4 5; do
            if tap_text "more"; then
              sleep 2; shot "03_more_$i"; dump "03_more_$i"; continue
            fi
            if tap_text "i agree"; then
              sleep 2; shot 03_agree; dump 03_agree; break
            fi
            if tap_text "get started"; then
              sleep 2; shot 03_started; dump 03_started; break
            fi
            echo "no MORE/I agree/Get started button at iter $i — assuming enrollment screen"
            break
          done
          sleep 2
          shot 04_pre_enroll && dump 04_pre_enroll
          # Step 3: send finger touches to enrol. Pixel Imprint requires ~6
          # touches; send 12 for margin.
          for i in $(seq 1 12); do adb emu finger touch 1; sleep 1; done
          sleep 2
          shot 05_after_touches && dump 05_after_touches
          # Step 4: dismiss the completion screen.
          if ! tap_text "done"; then
            tap_text "next" || adb shell input keyevent 23
          fi
          sleep 2
          shot 06_final && dump 06_final
          # Confirm enrollment took effect.
          adb shell dumpsys fingerprint > /tmp/biometric_screens/fingerprint_dump.txt 2>&1 || true
          # Sanity check: if dumpsys shows zero enrolled prints, fail loudly so
          # the job surface this rather than the test silently skipping.
          if grep -qE '"prints":\[\{"id":0,"count":0' /tmp/biometric_screens/fingerprint_dump.txt; then
            echo "::error::Fingerprint enrollment did not register any prints"
          fi
          WATCHER_FLAG=$(mktemp /tmp/finger_watcher.XXXXXX)
          ( while [ -f "$WATCHER_FLAG" ]; do adb emu finger touch 1 2>/dev/null; sleep 1; done ) &
          set +e
          ./gradlew :sdk:connectedAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=dev.vouchflow.sdk.integration.PasskeyTypeIntegrationTest#biometricEnrolled_enrollAndVerifySucceeds" --stacktrace
          GRADLE_EXIT=$?
          rm -f "$WATCHER_FLAG"
          wait 2>/dev/null || true
          # Check if the test actually ran (didn't skip).
          REPORT="sdk/build/reports/androidTests/connected/debug/com.android.builder.testing.api.TestServer.html"
          if grep -qi "skipped" sdk/build/outputs/androidTest-results/connected/*.xml 2>/dev/null; then
            echo "::error::Biometric integration test was skipped — fingerprint enrollment failed"
            exit 1
          fi
          exit $GRADLE_EXIT
          SCRIPT
          chmod +x /tmp/biometric_test.sh

      - name: Run biometric integration test
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          avd-name: biometric_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: /tmp/biometric_test.sh

      - name: Upload enrollment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biometric-enrollment-screens
          path: /tmp/biometric_screens/
          if-no-files-found: ignore

  release:
    # Tag-driven release. Pushing a `v*` tag (e.g. `git tag v2.0.0 && git push
    # origin v2.0.0`) is the explicit signal to publish — main pushes only
    # build/test, no version churn. The release version comes from the tag
    # name itself, not a CI-side increment of gradle.properties.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, integration-test, integration-test-biometric]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Resolve release version from tag
        id: bump
        run: |
          # Strip the leading 'v' from refs/tags/vX.Y.Z to get the bare semver.
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF' must be of the form vX.Y.Z (got '$TAG_VERSION')"
            exit 1
          fi
          # Sanity-check the tag matches gradle.properties so a tagged release
          # never disagrees with what the artifact embeds.
          FILE_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::Tag $TAG_VERSION does not match gradle.properties VERSION_NAME=$FILE_VERSION. Update one before tagging."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral \
            -PVERSION_NAME="${{ steps.bump.outputs.version }}" \
            --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
